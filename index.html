<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#36563b"><title>PVH | Digitális névjegyek</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172019;background:#f3f5f3}*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:inherit}.top{background:#36563b;color:white;padding:22px 20px 28px}.topin,main,footer{max-width:1080px;margin:auto}.brand{display:flex;align-items:center;gap:16px}.brand img{width:155px;max-height:62px;object-fit:contain;filter:brightness(0) invert(1)}.brand span{font-size:13px;line-height:1.4}.top h1{font-size:clamp(27px,4vw,38px);margin:28px 0 8px}.top p{margin:0;opacity:.9}main{padding:28px 20px 55px}.tools{display:grid;grid-template-columns:1fr 260px;gap:12px;margin-bottom:18px}input,select{width:100%;height:48px;border:1px solid #d7ded8;border-radius:11px;padding:0 14px;background:white;font:inherit}.meta{font-size:13px;color:#647067}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.person,.profile{background:white;border:1px solid #e2e8e2;border-radius:16px;padding:20px;box-shadow:0 5px 18px #17201908}.person{display:flex;flex-direction:column;min-height:220px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e8efe8;color:#36563b;font-weight:750;margin-bottom:14px}.person h2{font-size:18px;margin:0 0 5px}.role{font-size:14px;color:#526056;margin:0 0 4px}.org{font-size:13px;color:#748078;margin:0 0 18px}.btn{display:flex;align-items:center;justify-content:center;min-height:45px;padding:11px 14px;border-radius:10px;background:#36563b;color:white;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer;margin-top:auto}.empty{text-align:center;padding:30px;background:white;border:1px dashed #cbd5cc;border-radius:14px;color:#657067}.profilewrap{max-width:560px;margin:auto}.profile{text-align:center;padding:30px 24px}.logo{width:min(220px,75%);max-height:90px;object-fit:contain;margin:0 auto 24px;display:block}.profile h2{font-size:27px;margin:0 0 8px}.details{display:grid;gap:10px;margin:20px 0 24px;overflow-wrap:anywhere}.back{display:inline-block;margin-bottom:16px;color:#36563b;text-decoration:none;font-weight:650}.actions{display:grid;gap:10px}.secondary{background:#edf2ed;color:#29442e}.profile .btn{margin-top:0}footer{padding:0 20px 28px;color:#778078;font-size:12px}[hidden]{display:none!important}@media(max-width:620px){.tools{grid-template-columns:1fr}.brand img{width:125px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><img src="https://pvhdev.pecsikommunikacio.hu/wp-content/uploads/2026/07/pvh-menu-logo.svg" alt="PVH"><span>Digitális névjegyek<br>Pécsi Vagyonhasznosító Zrt.</span></div><h1 id="heading">Munkatársaink</h1><p id="subheading">Keresd meg kollégáink elérhetőségét, és mentsd el a névjegyüket.</p></div></header>
<main><section id="directory"><div class="tools"><input id="q" type="search" placeholder="Keresés név, beosztás vagy e-mail alapján…" aria-label="Keresés"><select id="dept" aria-label="Szervezeti egység"><option value="">Minden szervezeti egység</option></select></div><p class="meta" id="count"></p><div class="grid" id="cards"></div><div class="empty" id="empty" hidden>Nincs találat.</div></section><section id="profileview" hidden><div class="profilewrap"><a class="back" href="/">← Vissza a munkatársakhoz</a><article class="profile" id="profile"></article></div></section></main><footer>© Pécsi Vagyonhasznosító Zrt. · Digitális névjegyek</footer>
<script>
const LOGO="https://pvhdev.pecsikommunikacio.hu/wp-content/uploads/2026/07/pvh-menu-logo.svg";
const $=id=>document.getElementById(id);let people=[];
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toLocaleUpperCase("hu")}
function makeVcf(p){let a=p.name.trim().split(/\s+/),family=a.shift()||"",given=a.join(" ");const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");let l=["BEGIN:VCARD","VERSION:3.0",`N:${e(family)};${e(given)};;;`,`FN:${e(p.name)}`,`ORG:${e(p.organization)}`,`TITLE:${e(p.title)}`];if(p.phone)l.push(`TEL;TYPE=CELL,VOICE:${e(p.phone)}`);if(p.email)l.push(`EMAIL;TYPE=INTERNET,WORK:${e(p.email)}`);if(p.website)l.push(`URL:${e(p.website)}`);l.push("END:VCARD");return l.join("\r\n")+"\r\n"}
function save(p){let u=URL.createObjectURL(new Blob([makeVcf(p)],{type:"text/vcard;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=p.slug+".vcf";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function directory(){let q=$("q").value.trim().toLocaleLowerCase("hu"),d=$("dept").value;let list=people.filter(p=>(!q||[p.name,p.title,p.organization,p.department,p.email].join(" ").toLocaleLowerCase("hu").includes(q))&&(!d||p.department===d)).sort((a,b)=>a.name.localeCompare(b.name,"hu"));$("count").textContent=list.length+" munkatárs";$("cards").innerHTML=list.map(p=>`<article class="person"><div class="avatar">${esc(initials(p.name))}</div><h2>${esc(p.name)}</h2><p class="role">${esc(p.title)}</p><p class="org">${esc(p.organization)}${p.department?" · "+esc(p.department):""}</p><a class="btn" href="/${encodeURIComponent(p.slug)}">Névjegy megnyitása</a></article>`).join("");$("empty").hidden=!!list.length}
function profile(p){$("directory").hidden=true;$("profileview").hidden=false;$("heading").textContent="Digitális névjegy";$("subheading").textContent="Pécsi Vagyonhasznosító Zrt.";let detail=[p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:"",p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:"",p.website?`<a href="${esc(p.website)}">${esc(p.website)}</a>`:""].filter(Boolean).join("");$("profile").innerHTML=`<img class="logo" src="${LOGO}" alt="PVH logó"><h2>${esc(p.name)}</h2><p class="role">${esc(p.title)}</p><p class="org">${esc(p.organization)}</p><div class="details">${detail}</div><div class="actions"><button class="btn" id="save">Kapcsolat mentése</button>${p.phone?`<a class="btn secondary" href="tel:${esc(p.phone)}">Telefonhívás</a>`:""}${p.email?`<a class="btn secondary" href="mailto:${esc(p.email)}">E-mail küldése</a>`:""}</div>`;$("save").onclick=()=>save(p);document.title=p.name+" – PVH névjegy"}
async function start(){try{let r=await fetch("/data/contacts.json");if(!r.ok)throw Error("Nem tölthető be a contacts.json fájl.");people=await r.json();[...new Set(people.map(p=>p.department).filter(Boolean))].sort().forEach(d=>{let o=document.createElement("option");o.value=d;o.textContent=d;$("dept").append(o)});$("q").oninput=directory;$("dept").onchange=directory;let slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,""));let p=people.find(x=>x.slug===slug);if(p)profile(p);else{if(slug){$("heading").textContent="A névjegy nem található";$("subheading").textContent="Keresd a munkatársat a címtárban."}directory()}}catch(e){$("cards").textContent=e.message}}
start();
</script></body></html>
